<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-labelledby="title desc">
<title id="title">Hi, I'm Nox.</title>
<desc id="desc">A dark green terminal garden with pixel butterflies. Computer Science at Georgia Tech, M.S. in Machine Learning.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#234534" stroke-opacity=".28"/></pattern></defs>
<style>
text{font-family:Consolas,'Liberation Mono',monospace}
.flight{animation:drift 8s ease-in-out infinite}.second{animation-delay:-3s;animation-duration:11s}.third{animation-delay:-5s;animation-duration:9s}
.wing{transform-box:fill-box;transform-origin:center;animation:flutter 1.1s steps(3,end) infinite alternate}
.cursor{animation:blink 1.2s steps(1,end) infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}25%{transform:translate(12px,-12px)}60%{transform:translate(-10px,-5px)}}
@keyframes flutter{from{transform:scaleX(1)}to{transform:scaleX(.55)}}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.flight,.wing,.cursor{animation:none}}
</style>
