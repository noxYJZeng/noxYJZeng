<text x="36" y="87" font-size="11" letter-spacing="2" fill="#68ffac">&gt; NOX_ZENG / HELLO WORLD</text>
<text x="33" y="147" font-size="44" font-weight="700" fill="#dce9df">Hi, I'm Nox.<tspan class="cursor" fill="#68ffac">_</tspan></text>
<text x="36" y="190" font-size="15" fill="#dce9df">Computer Science @ Georgia Tech</text>
<text x="36" y="216" font-size="12" fill="#98afa0">M.S. · Machine Learning</text>
<text x="24" y="285" font-size="10" letter-spacing="1.2" fill="#98afa0">CODE / ART / CURIOSITY</text>
<text x="630" y="285" font-size="10" fill="#68ffac">LEPIDOPTERA / PIXEL LIFE</text>
